name: Deploy to Cloudflare Pages

# Любой пуш в main пересобирает сайт и выкатывает его на indagor.online.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Сборка dist/
        run: node build.mjs

      - name: Проверка, что в dist нет Netlify
        run: |
          if grep -rIl -i 'netlify\|analytics-tracker' dist; then
            echo "FAIL: в dist остались упоминания Netlify"; exit 1
          fi
          echo "OK: dist чистый"

      - name: Deploy
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy dist --project-name indagor-online-pages --branch main
