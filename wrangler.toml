# wrangler.toml — Cloudflare Pages, проект indagor-online-pages (indagor.online)
# Сайт статический, сборщика нет: build.mjs только готовит чистый dist/
# (убирает netlify/, package.json, отчёты), затем wrangler заливает его.
#
# Деплой: npx wrangler pages deploy dist --project-name indagor-online-pages --branch main

name = "indagor-online-pages"
compatibility_date = "2026-11-25"
pages_build_output_dir = "dist"
